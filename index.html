<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>BOTELA MANAGER PRO</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter',sans-serif;
    background:#000;
    color:white;
    padding:20px;
}

h1{
    text-align:center;
    font-size:28px;
    margin-bottom:5px;
}

.subtitle{
    text-align:center;
    color:#9ca3af;
    margin-bottom:20px;
}

.container{
    max-width:450px;
    margin:auto;
}

.card{
    background:#111827;
    border-radius:20px;
    padding:18px;
    margin-bottom:15px;
    box-shadow:0 0 15px rgba(255,255,255,0.03);
}

.product{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px 0;
    border-bottom:1px solid rgba(255,255,255,0.06);
}

.product:last-child{
    border-bottom:none;
}

.name{
    font-weight:700;
    font-size:16px;
}

.price{
    font-size:13px;
    color:#9ca3af;
    margin-top:4px;
}

.controls{
    display:flex;
    align-items:center;
    gap:10px;
}

.qty{
    min-width:35px;
    text-align:center;
    font-size:20px;
    font-weight:bold;
}

button{
    border:none;
    border-radius:12px;
    background:#1f2937;
    color:white;
    padding:8px 14px;
    font-size:18px;
    cursor:pointer;
}

button:active{
    transform:scale(0.95);
}

.primary{
    background:#22c55e;
    font-weight:bold;
}

.danger{
    background:#ef4444;
    font-weight:bold;
}

.full{
    width:100%;
    margin-top:10px;
    padding:15px;
}

.result{
    white-space:pre-line;
    line-height:1.8;
    font-size:15px;
}

.total{
    color:#22c55e;
    font-weight:bold;
}

.footer{
    text-align:center;
    color:#6b7280;
    margin-top:20px;
    font-size:13px;
}

</style>
</head>

<body>

<h1>BOTELA MANAGER</h1>

<div class="subtitle">
Coffee Business Calculator
</div>

<div class="container">

<div class="card">

<!-- AMERICANO -->
<div class="product">

<div>
<div class="name">☕ Americano</div>
<div class="price">
Jual Rp10.000
</div>
</div>

<div class="controls">
<button onclick="kurang('americano')">−</button>
<div id="americano" class="qty">0</div>
<button onclick="tambah('americano')">+</button>
</div>

</div>

<!-- KOPI SUSU -->
<div class="product">

<div>
<div class="name">🥛 Kopi Susu</div>
<div class="price">
Jual Rp15.000
</div>
</div>

<div class="controls">
<button onclick="kurang('kopisusu')">−</button>
<div id="kopisusu" class="qty">0</div>
<button onclick="tambah('kopisusu')">+</button>
</div>

</div>

<!-- MATCHA -->
<div class="product">

<div>
<div class="name">🍵 Matcha</div>
<div class="price">
Jual Rp12.000
</div>
</div>

<div class="controls">
<button onclick="kurang('matcha')">−</button>
<div id="matcha" class="qty">0</div>
<button onclick="tambah('matcha')">+</button>
</div>

</div>

</div>

<!-- HASIL -->
<div class="card result" id="hasil">
Belum ada transaksi
</div>

<button class="primary full" onclick="hitung()">
💰 Hitung Profit
</button>

<button class="danger full" onclick="resetData()">
🗑 Reset Data
</button>

<div class="footer">
BOTELA • Profit Tracker
</div>

</div>

<script>

// ================= DATA =================
let data = JSON.parse(localStorage.getItem("botelaData")) || {
    americano:0,
    kopisusu:0,
    matcha:0
};

// ================= HARGA JUAL =================
const HARGA = {
    americano:10000,
    kopisusu:15000,
    matcha:12000
};

// ================= HPP TERBARU =================
const HPP = {
    americano:2153,
    kopisusu:7198,
    matcha:5944
};

// ================= MODAL AMAN =================
const MODAL = {
    americano:2500,
    kopisusu:8000,
    matcha:6500
};

// ================= FORMAT RUPIAH =================
function rupiah(x){
    return "Rp" + x.toLocaleString("id-ID");
}

// ================= UPDATE UI =================
function updateUI(){

    document.getElementById("americano").innerText = data.americano;
    document.getElementById("kopisusu").innerText = data.kopisusu;
    document.getElementById("matcha").innerText = data.matcha;

}

updateUI();

// ================= SAVE =================
function save(){

    localStorage.setItem(
        "botelaData",
        JSON.stringify(data)
    );

    updateUI();
}

// ================= CONTROL =================
function tambah(menu){

    data[menu]++;
    save();

}

function kurang(menu){

    if(data[menu] > 0){
        data[menu]--;
    }

    save();
}

// ================= HITUNG =================
function hitung(){

    let omzet = 0;
    let modal = 0;
    let profit = 0;

    let text = "";

    for(let p in data){

        let qty = data[p];

        let o = qty * HARGA[p];
        let m = qty * MODAL[p];
        let h = qty * HPP[p];
        let pr = o - h;

        omzet += o;
        modal += m;
        profit += pr;

        let nama = "";

        if(p === "americano") nama = "☕ AMERICANO";
        if(p === "kopisusu") nama = "🥛 KOPI SUSU";
        if(p === "matcha") nama = "🍵 MATCHA";

        text += `${nama}

Qty:
${qty}

Omzet:
${rupiah(o)}

Modal Aman:
${rupiah(m)}

Profit Bersih:
${rupiah(pr)}

====================

`;
    }

    text += `💰 TOTAL OMZET
${rupiah(omzet)}

📦 TOTAL MODAL
${rupiah(modal)}

🟢 TOTAL PROFIT
${rupiah(profit)}
`;

    document.getElementById("hasil").innerText = text;
}

// ================= RESET =================
function resetData(){

    if(!confirm("Reset semua data?")){
        return;
    }

    data = {
        americano:0,
        kopisusu:0,
        matcha:0
    };

    save();

    document.getElementById("hasil").innerText =
    "Data berhasil direset";

}

</script>

</body>
</html>
