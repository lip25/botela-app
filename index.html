<script>

// ================= DATA =================

let data = JSON.parse(localStorage.getItem("botelaData")) || {
    americano:0,
    kopisusu:0,
    matcha:0
};

// ================= HARGA JUAL =================

const HARGA = {
    americano:12000,
    kopisusu:15000,
    matcha:15000
};

// ================= HPP REAL BOTELA =================

// AMERICANO
// kopi 3g = 1733
// botol = 750
// stiker = 350
// total = 2833

// KOPI SUSU
// kopi 3g = 1733
// susu 140ml = 3220
// skm 8ml = 224
// creamer 3g = 240
// gula aren 15ml = 600
// botol = 750
// stiker = 350
// total = 7117

// MATCHA
// matcha 15g = 795
// susu 140ml = 3220
// botol = 750
// stiker = 350
// total = 5115

const HPP = {
    americano:2833,
    kopisusu:7117,
    matcha:5115
};

// ================= MODAL AMAN +15% =================

const MODAL = {
    americano:3250,
    kopisusu:8200,
    matcha:5900
};

// ================= FORMAT =================

function rupiah(x){
    return "Rp" + Math.round(x).toLocaleString("id-ID");
}

// ================= UPDATE UI =================

function updateUI(){

    document.getElementById("americano").innerText = data.americano;
    document.getElementById("kopisusu").innerText = data.kopisusu;
    document.getElementById("matcha").innerText = data.matcha;

    let total =
        data.americano +
        data.kopisusu +
        data.matcha;

    document.getElementById("totalBotol").innerText =
    "Total Botol: " + total;
}

updateUI();

// ================= SAVE =================

function save(){
    localStorage.setItem("botelaData", JSON.stringify(data));
    updateUI();
}

// ================= CONTROL =================

function tambah(menu){
    data[menu]++;
    save();
}

function kurang(menu){
    if(data[menu] > 0){
        data[menu]--;
        save();
    }
}

// ================= HITUNG =================

function hitung(){

    let omzet = 0;
    let modal = 0;
    let profit = 0;
    let totalBotol = 0;

    let hasil = "";

    const nama = {
        americano:"Americano",
        kopisusu:"Kopi Susu",
        matcha:"Matcha"
    };

    for(let p in data){

        let qty = data[p];

        if(qty <= 0) continue;

        let o = qty * HARGA[p];
        let m = qty * MODAL[p];
        let hpp = qty * HPP[p];
        let pft = o - hpp;

        omzet += o;
        modal += m;
        profit += pft;
        totalBotol += qty;

        hasil +=
`${nama[p]}
Qty: ${qty}
Omzet: ${rupiah(o)}
Modal Simpan: ${rupiah(m)}
Profit: ${rupiah(pft)}

`;
    }

    if(totalBotol === 0){

        document.getElementById("hasil").innerText =
        "Belum ada transaksi";

        return;
    }

    hasil +=
`━━━━━━━━━━

TOTAL BOTOL
${totalBotol}

TOTAL OMZET
${rupiah(omzet)}

MODAL WAJIB DISIMPAN
${rupiah(modal)}

PROFIT BERSIH
${rupiah(profit)}`;

    document.getElementById("hasil").innerText = hasil;
}

// ================= RESET =================

function resetData(){

    let yakin = confirm("Reset semua data transaksi?");

    if(!yakin) return;

    data = {
        americano:0,
        kopisusu:0,
        matcha:0
    };

    save();

    document.getElementById("hasil").innerText =
    "Belum ada transaksi";
}

</script>
