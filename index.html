from pathlib import Path

html = """<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BOTELA Finance</title>
<style>
body{font-family:Arial,sans-serif;background:#111827;color:#fff;margin:0;padding:20px}
.card{background:#1f2937;padding:15px;border-radius:12px;margin-bottom:15px}
input{width:100%;padding:10px;margin:5px 0 12px;border:none;border-radius:8px;background:#374151;color:#fff;box-sizing:border-box}
button{padding:10px 15px;border:none;border-radius:8px;font-weight:bold;cursor:pointer}
.btn{background:#f59e0b;color:#000}
.del{background:#dc2626;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.result{font-size:28px;font-weight:bold}
table{width:100%;border-collapse:collapse}
th,td{border:1px solid #374151;padding:8px;text-align:center}
</style>
</head>
<body>

<h1>BOTELA Finance</h1>

<div class="card">
<h3>Input Penjualan</h3>

<label>Americano (Rp12.000)</label>
<input type="number" id="americano" value="0" min="0">

<label>Kopi Susu Aren (Rp15.000)</label>
<input type="number" id="kopsuren" value="0" min="0">

<label>Matcha (Rp15.000)</label>
<input type="number" id="matcha" value="0" min="0">

<button class="btn" onclick="hitungDanSimpan()">Hitung & Simpan</button>
</div>

<div class="grid">
<div class="card">
<h3>💰 Uang Modal</h3>
<div id="modal" class="result">Rp0</div>
</div>

<div class="card">
<h3>💵 Uang Pribadi</h3>
<div id="pribadi" class="result">Rp0</div>
</div>
</div>

<div class="card">
<h3>Riwayat Tersimpan</h3>
<button class="del" onclick="hapusSemua()">Hapus Semua Riwayat</button>
<br><br>
<table>
<thead>
<tr>
<th>Tanggal & Jam</th>
<th>Uang Modal</th>
<th>Uang Pribadi</th>
<th>Aksi</th>
</tr>
</thead>
<tbody id="riwayat"></tbody>
</table>
</div>

<script>
const harga={americano:12000,kopsuren:15000,matcha:15000};
const hpp={americano:4520,kopsuren:8750,matcha:5987};

function rupiah(n){
 return "Rp"+Math.round(n).toLocaleString("id-ID");
}

function hitungDanSimpan(){
 const a=parseInt(document.getElementById('americano').value)||0;
 const k=parseInt(document.getElementById('kopsuren').value)||0;
 const m=parseInt(document.getElementById('matcha').value)||0;

 const omzet=(a*harga.americano)+(k*harga.kopsuren)+(m*harga.matcha);
 const modalTerpakai=(a*hpp.americano)+(k*hpp.kopsuren)+(m*hpp.matcha);
 const laba=omzet-modalTerpakai;

 const uangModal=modalTerpakai+(laba*0.50);
 const uangPribadi=laba*0.50;

 document.getElementById('modal').textContent=rupiah(uangModal);
 document.getElementById('pribadi').textContent=rupiah(uangPribadi);

 let data=JSON.parse(localStorage.getItem('botelaData') || '[]');

 data.unshift({
   waktu:new Date().toLocaleString('id-ID'),
   modal:uangModal,
   pribadi:uangPribadi
 });

 localStorage.setItem('botelaData', JSON.stringify(data));
 tampilRiwayat();
}

function tampilRiwayat(){
 const data=JSON.parse(localStorage.getItem('botelaData') || '[]');
 const tbody=document.getElementById('riwayat');
 tbody.innerHTML='';

 data.forEach((item,index)=>{
   tbody.innerHTML += `
   <tr>
   <td>${item.waktu}</td>
   <td>${rupiah(item.modal)}</td>
   <td>${rupiah(item.pribadi)}</td>
   <td><button class="del" onclick="hapusData(${index})">Hapus</button></td>
   </tr>`;
 });
}

function hapusData(index){
 let data=JSON.parse(localStorage.getItem('botelaData') || '[]');
 data.splice(index,1);
 localStorage.setItem('botelaData', JSON.stringify(data));
 tampilRiwayat();
}

function hapusSemua(){
 if(confirm('Hapus semua riwayat?')){
   localStorage.removeItem('botelaData');
   tampilRiwayat();
 }
}

window.onload=tampilRiwayat;
</script>

</body>
</html>
"""

path="/mnt/data/index.html"
Path(path).write_text(html, encoding="utf-8")
print(path)
