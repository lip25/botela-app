<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BOTELA Finance</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0f172a;
color:white;
padding:20px;
}

h1{
text-align:center;
margin-bottom:20px;
color:#f59e0b;
}

.card{
background:#1e293b;
padding:15px;
border-radius:15px;
margin-bottom:15px;
}

label{
display:block;
margin-top:10px;
margin-bottom:5px;
}

input{
width:100%;
padding:10px;
border:none;
border-radius:8px;
background:#334155;
color:white;
}

button{
border:none;
padding:10px 15px;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

.btn{
background:#f59e0b;
color:black;
margin-top:15px;
}

.btn-danger{
background:#dc2626;
color:white;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:15px;
}

.value{
font-size:28px;
font-weight:bold;
margin-top:10px;
}

table{
width:100%;
border-collapse:collapse;
margin-top:10px;
}

th,td{
border:1px solid #334155;
padding:8px;
text-align:center;
}

th{
background:#334155;
}
</style>

</head>
<body>

<h1>BOTELA FINANCE</h1>

<div class="card">

<label>Americano (Rp12.000)</label>
<input type="number" id="americano" value="0">

<label>Kopi Susu Aren (Rp15.000)</label>
<input type="number" id="kopsuren" value="0">

<label>Matcha (Rp15.000)</label>
<input type="number" id="matcha" value="0">

<button class="btn" onclick="simpanPenjualan()">
Simpan Penjualan
</button>

</div>

<div class="grid">

<div class="card">
<h3>💰 Total Modal Terkumpul</h3>
<div id="totalModal" class="value">Rp0</div>
</div>

<div class="card">
<h3>💵 Total Pribadi Terkumpul</h3>
<div id="totalPribadi" class="value">Rp0</div>
</div>

</div>

<div class="card">

<h3>Riwayat Penjualan</h3>

<button class="btn-danger" onclick="hapusSemua()">
Hapus Semua Riwayat
</button>

<table>

<thead>
<tr>
<th>Tanggal</th>
<th>Modal</th>
<th>Pribadi</th>
<th>Aksi</th>
</tr>
</thead>

<tbody id="riwayat"></tbody>

</table>

</div>

<script>

const harga={
americano:12000,
kopsuren:15000,
matcha:15000
};

const hpp={
americano:4520,
kopsuren:8750,
matcha:5987
};

function rupiah(angka){
return "Rp" + angka.toLocaleString("id-ID");
}

function simpanPenjualan(){

let a=parseInt(document.getElementById("americano").value)||0;
let k=parseInt(document.getElementById("kopsuren").value)||0;
let m=parseInt(document.getElementById("matcha").value)||0;

if(a===0 && k===0 && m===0){
alert("Masukkan jumlah penjualan terlebih dahulu");
return;
}

let omzet=
(a*harga.americano)+
(k*harga.kopsuren)+
(m*harga.matcha);

let modalTerpakai=
(a*hpp.americano)+
(k*hpp.kopsuren)+
(m*hpp.matcha);

let laba=omzet-modalTerpakai;

let uangModal=
modalTerpakai+(laba*0.5);

let uangPribadi=
laba*0.5;

let data=
JSON.parse(localStorage.getItem("botelaData"))||[];

data.unshift({
tanggal:new Date().toLocaleString("id-ID"),
modal:Math.round(uangModal),
pribadi:Math.round(uangPribadi)
});

localStorage.setItem(
"botelaData",
JSON.stringify(data)
);

document.getElementById("americano").value=0;
document.getElementById("kopsuren").value=0;
document.getElementById("matcha").value=0;

loadData();

}

function hapusData(index){

let data=
JSON.parse(localStorage.getItem("botelaData"))||[];

if(confirm("Hapus data ini?")){

data.splice(index,1);

localStorage.setItem(
"botelaData",
JSON.stringify(data)
);

loadData();

}

}

function hapusSemua(){

if(confirm("Hapus semua riwayat?")){

localStorage.removeItem("botelaData");

loadData();

}

}

function loadData(){

let data=
JSON.parse(localStorage.getItem("botelaData"))||[];

let html="";

let totalModal=0;
let totalPribadi=0;

data.forEach((item,index)=>{

totalModal+=item.modal;
totalPribadi+=item.pribadi;

html+=`
<tr>
<td>${item.tanggal}</td>
<td>${rupiah(item.modal)}</td>
<td>${rupiah(item.pribadi)}</td>
<td>
<button
class="btn-danger"
onclick="hapusData(${index})">
Hapus
</button>
</td>
</tr>
`;

});

document.getElementById("riwayat").innerHTML=html;

document.getElementById("totalModal").innerHTML=
rupiah(totalModal);

document.getElementById("totalPribadi").innerHTML=
rupiah(totalPribadi);

}

loadData();

</script>

</body>
</html>
