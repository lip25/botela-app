<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BOTELA Finance</title>
<style>
body{font-family:Arial,sans-serif;background:#111827;color:#fff;margin:0;padding:20px}
.card{background:#1f2937;padding:15px;border-radius:12px;margin-bottom:15px}
input{width:100%;padding:10px;margin-top:5px;background:#374151;color:#fff;border:none;border-radius:8px}
button{padding:10px 15px;border:none;border-radius:8px;cursor:pointer;font-weight:bold}
.btn{background:#f59e0b;color:#000}
.btn-delete{background:#dc2626;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
h1{text-align:center}
table{width:100%;border-collapse:collapse}
th,td{border:1px solid #374151;padding:8px;text-align:center}
</style>
</head>
<body>

<h1>BOTELA Finance</h1>

<div class="card">
<h3>Penjualan Hari Ini</h3>

<label>Americano (Rp12.000)</label>
<input type="number" id="americano" value="0">

<label>Kopi Susu Aren (Rp15.000)</label>
<input type="number" id="kopsuren" value="0">

<label>Matcha (Rp15.000)</label>
<input type="number" id="matcha" value="0">

<br><br>
<button class="btn" onclick="hitung()">Hitung & Simpan</button>
</div>

<div class="grid">
<div class="card"><h3>Omzet</h3><div id="omzet">Rp0</div></div>
<div class="card"><h3>Modal (HPP)</h3><div id="modal">Rp0</div></div>
<div class="card"><h3>Laba</h3><div id="laba">Rp0</div></div>
<div class="card"><h3>Uang Pribadi (30%)</h3><div id="pribadi">Rp0</div></div>
<div class="card"><h3>Dana Usaha (70%)</h3><div id="usaha">Rp0</div></div>
</div>

<div class="card">
<h3>Riwayat Penjualan</h3>
<button class="btn-delete" onclick="hapusSemua()">Hapus Semua Riwayat</button>
<br><br>

<table>
<thead>
<tr>
<th>Tanggal</th>
<th>Omzet</th>
<th>Laba</th>
<th>Aksi</th>
</tr>
</thead>
<tbody id="riwayat"></tbody>
</table>
</div>

<script>
const harga={americano:12000,kopsuren:15000,matcha:15000};
const hpp={americano:4520,kopsuren:8750,matcha:5987};

function rupiah(n){
 return "Rp"+n.toLocaleString("id-ID");
}

function hitung(){
 let a=+document.getElementById("americano").value||0;
 let k=+document.getElementById("kopsuren").value||0;
 let m=+document.getElementById("matcha").value||0;

 let omzet=(a*harga.americano)+(k*harga.kopsuren)+(m*harga.matcha);
 let modal=(a*hpp.americano)+(k*hpp.kopsuren)+(m*hpp.matcha);
 let laba=omzet-modal;
 let pribadi=Math.round(laba*0.30);
 let usaha=Math.round(laba*0.70);

 document.getElementById("omzet").innerText=rupiah(omzet);
 document.getElementById("modal").innerText=rupiah(modal);
 document.getElementById("laba").innerText=rupiah(laba);
 document.getElementById("pribadi").innerText=rupiah(pribadi);
 document.getElementById("usaha").innerText=rupiah(usaha);

 let data=JSON.parse(localStorage.getItem("botelaData")||"[]");

 data.unshift({
   tanggal:new Date().toLocaleDateString("id-ID"),
   omzet:omzet,
   laba:laba
 });

 localStorage.setItem("botelaData",JSON.stringify(data));
 tampilRiwayat();
}

function hapusData(index){
 let data=JSON.parse(localStorage.getItem("botelaData")||"[]");

 if(confirm("Hapus data ini?")){
   data.splice(index,1);
   localStorage.setItem("botelaData",JSON.stringify(data));
   tampilRiwayat();
 }
}

function hapusSemua(){
 if(confirm("Yakin ingin menghapus semua riwayat?")){
   localStorage.removeItem("botelaData");
   tampilRiwayat();
 }
}

function tampilRiwayat(){
 let data=JSON.parse(localStorage.getItem("botelaData")||"[]");
 let html="";

 data.forEach((d,index)=>{
   html += `
   <tr>
     <td>${d.tanggal}</td>
     <td>${rupiah(d.omzet)}</td>
     <td>${rupiah(d.laba)}</td>
     <td>
       <button class="btn-delete" onclick="hapusData(${index})">Hapus</button>
     </td>
   </tr>`;
 });

 document.getElementById("riwayat").innerHTML=html;
}

tampilRiwayat();
</script>

</body>
</html>
